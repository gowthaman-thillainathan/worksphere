openapi: 3.1.0
info:
  title: Meridian API
  version: 1.0.0
  summary: Enterprise Employee Management Platform
  description: |
    REST API of the Meridian platform. This document is the contract between the
    API and its clients; it is validated in CI against every registered route.

    ## Authentication
    1. `POST /auth/login` returns a short-lived **JWT access token** (15 min) in the
       body and sets the **refresh token** in an `HttpOnly`, `Secure`,
       `SameSite=Strict` cookie scoped to `/api/v1/auth`.
    2. Send the access token as `Authorization: Bearer <token>`.
    3. Before it expires, call `POST /auth/refresh` (the browser sends the cookie).
       Refresh tokens are single-use and rotated; replaying a used one revokes the
       whole session.

    ## Errors
    Every error is an RFC 9457 `application/problem+json` document with a stable
    `code` and the `request_id` to quote to support.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8000/api/v1
    description: Local development
  - url: https://api.meridian.app/api/v1
    description: Production
tags:
  - name: Authentication
    description: Sign-in, token refresh and sign-out.
  - name: Password
    description: Forgotten-password flow.
  - name: Email verification
  - name: Current user
  - name: Access control
    description: Roles and permissions (RBAC).
  - name: Employees
    description: Employee profiles, directory search and profile photos.
  - name: Audit
    description: Tamper-evident audit trail.

paths:
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Sign in with e-mail and password
      description: |
        Rate limited per account and per IP. After 5 consecutive wrong passwords
        the account is locked for 15 minutes and the owner is e-mailed. Unknown
        accounts, wrong passwords, locked and disabled accounts all produce the
        same `invalid_credentials` error.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenEnvelope'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshToken
      summary: Rotate the refresh token and get a new access token
      security:
        - refreshTokenCookie: []
      responses:
        '200':
          description: New token pair. The previous refresh token is now invalid.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenEnvelope'
        '401':
          description: Missing, expired, revoked or reused refresh token (`invalid_refresh_token`). Sign in again.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: End the current session
      description: Revokes the presented access token and the session's refresh tokens, and clears the cookie.
      responses:
        '204':
          description: Signed out.
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/logout-all:
    post:
      tags: [Authentication]
      operationId: logoutEverywhere
      summary: End every session of the current user
      responses:
        '204':
          description: Every session on every device has been ended.
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/forgot-password:
    post:
      tags: [Password]
      operationId: forgotPassword
      summary: Request a password reset e-mail
      description: Always answers 202 so that the endpoint cannot be used to discover accounts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
      responses:
        '202':
          description: If the account exists and is active, a reset link has been sent.
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/reset-password:
    post:
      tags: [Password]
      operationId: resetPassword
      summary: Set a new password with a reset token
      description: Signs the user out on every device and marks the e-mail address as verified.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password changed.
        '422':
          description: Invalid input (`validation_failed`) or an invalid/expired token (`invalid_password_reset_token`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/email/verify/{id}/{hash}:
    get:
      tags: [Email verification]
      operationId: verifyEmail
      summary: Confirm an e-mail address (signed link from the e-mail)
      description: Opened in a browser. Redirects to the SPA's success or failure page.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: hash
          in: path
          required: true
          schema:
            type: string
        - name: expires
          in: query
          required: true
          schema:
            type: integer
        - name: signature
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to `{FRONTEND_URL}/email-verified` or `{FRONTEND_URL}/email-verification-failed`.

  /auth/email/verification-notification:
    post:
      tags: [Email verification]
      operationId: resendEmailVerification
      summary: Re-send the verification e-mail
      responses:
        '202':
          description: Sent, unless the address is already verified.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'

  /me:
    get:
      tags: [Current user]
      operationId: getCurrentUser
      summary: The signed-in user, roles and effective permissions
      description: Available to unverified users so the SPA can prompt for verification.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                  meta:
                    type: object
                    required: [roles, permissions]
                    properties:
                      roles:
                        type: array
                        items:
                          type: string
                        example: [tenant_admin]
                      permissions:
                        type: array
                        items:
                          type: string
                        example: [access.manage, audit.view]
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /permissions:
    get:
      tags: [Access control]
      operationId: listPermissions
      summary: The permission catalogue
      description: 'Requires `access.manage` and a verified e-mail address.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Permission'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /roles:
    get:
      tags: [Access control]
      operationId: listRoles
      summary: Roles and the permissions they grant
      description: 'Requires `access.manage` and a verified e-mail address.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /employees:
    get:
      tags: [Employees]
      operationId: listEmployees
      summary: Search, filter, sort and page through the employee directory
      description: |
        Requires `employee.view`. Cursor-paginated: pass `meta.next_cursor` back as `cursor`.
        Values inside one filter are OR-ed (`filter[status]=active,on_leave`); different
        filters are AND-ed. Unknown filters or sort fields are rejected with 422.
      parameters:
        - name: q
          in: query
          description: Case-insensitive substring match on first/last/preferred name, employee number and work e-mail.
          schema:
            type: string
            maxLength: 100
        - name: filter[status]
          in: query
          description: Comma-separated statuses.
          schema:
            type: string
            example: active,on_leave
        - name: filter[employment_type]
          in: query
          description: Comma-separated employment types.
          schema:
            type: string
            example: full_time,part_time
        - name: filter[manager_id]
          in: query
          schema:
            type: string
            format: uuid
        - name: filter[hire_date][gte]
          in: query
          schema:
            type: string
            format: date
        - name: filter[hire_date][lte]
          in: query
          schema:
            type: string
            format: date
        - name: filter[trashed]
          in: query
          description: Include soft-deleted employees (`with`) or show only them (`only`).
          schema:
            type: string
            enum: [with, only]
        - name: sort
          in: query
          description: 'Comma-separated fields; prefix with `-` for descending. Default: `last_name,first_name`.'
          schema:
            type: string
            example: -hire_date,last_name
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of employees.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, links]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Employee'
                  meta:
                    $ref: '#/components/schemas/CursorMeta'
                  links:
                    $ref: '#/components/schemas/CursorLinks'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [Employees]
      operationId: createEmployee
      summary: Create an employee
      description: |
        Requires `employee.create`; personal fields (`personal_email`, `phone`,
        `date_of_birth`) also require `employee.update.sensitive`. The employee number is
        generated. Audited as `employee.created`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeCreate'
      responses:
        '201':
          description: Created.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /employees/{employee}:
    parameters:
      - $ref: '#/components/parameters/EmployeeId'
    get:
      tags: [Employees]
      operationId: getEmployee
      summary: Get one employee
      description: Requires `employee.view`. Personal fields are included only with `employee.view.sensitive`.
      responses:
        '200':
          description: OK
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Employees]
      operationId: updateEmployee
      summary: Update some fields of an employee
      description: |
        Requires `employee.update` (and `employee.update.sensitive` for personal fields).
        Send the `ETag` you received as `If-Match`; a stale version is rejected with 412.
        Only real changes bump the version and are audited as `employee.updated`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeUpdate'
      responses:
        '200':
          description: Updated.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
    delete:
      tags: [Employees]
      operationId: deleteEmployee
      summary: Soft-delete an employee
      description: |
        Requires `employee.delete` and `If-Match`. The record is hidden from the directory but
        kept (restorable, history preserved). Employees with direct reports cannot be deleted.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /employees/{employee}/restore:
    parameters:
      - $ref: '#/components/parameters/EmployeeId'
    post:
      tags: [Employees]
      operationId: restoreEmployee
      summary: Restore a soft-deleted employee
      description: Requires `employee.delete`. Idempotent. Fails with 409 if the work e-mail was reused meanwhile.
      responses:
        '200':
          description: Restored.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /employees/{employee}/photo:
    parameters:
      - $ref: '#/components/parameters/EmployeeId'
    get:
      tags: [Employees]
      operationId: getEmployeePhoto
      summary: Download the profile photo
      description: Requires `employee.view`. Served through the API; photos are never publicly addressable.
      responses:
        '200':
          description: The image.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Employees]
      operationId: uploadEmployeePhoto
      summary: Upload or replace the profile photo
      description: |
        Requires `employee.update`. JPEG, PNG or WebP (type detected from content), at most
        2 MB, between 128×128 and 4096×4096 pixels. Audited as `employee.photo_updated`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Photo stored.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Employees]
      operationId: deleteEmployeePhoto
      summary: Remove the profile photo
      description: Requires `employee.update`. Audited as `employee.photo_removed`.
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /audit-events:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      summary: Browse the audit trail (newest first)
      description: |
        Requires `audit.view`. Every event is hash-chained to the previous one; the chain is
        verified nightly (`php artisan audit:verify`). Personal data values are masked as `***`.
      parameters:
        - name: filter[subject_type]
          in: query
          schema:
            type: string
            example: employee
        - name: filter[subject_id]
          in: query
          schema:
            type: string
            format: uuid
        - name: filter[actor_id]
          in: query
          schema:
            type: string
            format: uuid
        - name: filter[action]
          in: query
          schema:
            type: string
            example: employee.updated
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of events.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, links]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
                  meta:
                    $ref: '#/components/schemas/CursorMeta'
                  links:
                    $ref: '#/components/schemas/CursorLinks'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256-signed JWT access token, valid for 15 minutes.
    refreshTokenCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Opaque, single-use refresh token set by login/refresh. Not readable by JavaScript.

  parameters:
    EmployeeId:
      name: employee
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The ETag of the version you are editing, e.g. `"v3"`.
      schema:
        type: string
        example: '"v3"'
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from `meta.next_cursor` / `meta.prev_cursor`.
      schema:
        type: string

  headers:
    ETag:
      description: 'Current version of the resource, e.g. `"v3"`. Send it back as `If-Match` when writing.'
      schema:
        type: string
    RefreshTokenCookie:
      description: '`refresh_token=<opaque>; Path=/api/v1/auth; Secure; HttpOnly; SameSite=Strict`'
      schema:
        type: string

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: ada@meridian.test
        password:
          type: string
          format: password
          maxLength: 1024

    ResetPasswordRequest:
      type: object
      required: [token, email, password, password_confirmation]
      properties:
        token:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 1024
          description: At least 12 characters and not found in known data breaches.
        password_confirmation:
          type: string
          format: password

    AccessTokenEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AccessToken'

    AccessToken:
      type: object
      required: [access_token, token_type, expires_in, expires_at, user]
      properties:
        access_token:
          type: string
          example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiIsImtpZCI6InYxIn0...
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Seconds until the access token expires.
          example: 900
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, type, name, email, email_verified, status]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [user]
        name:
          type: string
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        status:
          type: string
          enum: [active, disabled]
        last_login_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time

    Permission:
      type: object
      required: [key, module, description, is_sensitive]
      properties:
        key:
          type: string
          example: employee.view
        module:
          type: string
          example: employee
        description:
          type: string
        is_sensitive:
          type: boolean

    Role:
      type: object
      required: [id, key, name, is_system, permissions]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          example: tenant_admin
        name:
          type: string
        description:
          type: [string, 'null']
        is_system:
          type: boolean
        permissions:
          type: array
          items:
            type: string

    EmployeeEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Employee'

    Employee:
      type: object
      required: [id, type, employee_number, first_name, last_name, display_name, work_email, job_title, employment_type, status, hire_date, meta]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [employee]
        employee_number:
          type: string
          example: EMP-000421
        first_name:
          type: string
        last_name:
          type: string
        preferred_name:
          type: [string, 'null']
        display_name:
          type: string
        work_email:
          type: string
          format: email
        job_title:
          type: string
        employment_type:
          $ref: '#/components/schemas/EmploymentType'
        status:
          $ref: '#/components/schemas/EmployeeStatus'
        hire_date:
          type: string
          format: date
        termination_date:
          type: [string, 'null']
          format: date
        manager:
          type: [object, 'null']
          properties:
            id:
              type: string
              format: uuid
            display_name:
              type: string
        photo_url:
          type: [string, 'null']
          format: uri
        personal_email:
          type: [string, 'null']
          description: Only with `employee.view.sensitive`.
        phone:
          type: [string, 'null']
          description: Only with `employee.view.sensitive`.
        date_of_birth:
          type: [string, 'null']
          format: date
          description: Only with `employee.view.sensitive`.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: [string, 'null']
          format: date-time
        meta:
          type: object
          required: [version, permissions]
          properties:
            version:
              type: integer
            permissions:
              type: array
              description: Actions the current user may take on this record.
              items:
                type: string
                enum: [update, delete, view_sensitive, update_sensitive]

    EmployeeStatus:
      type: string
      enum: [pre_boarding, active, on_leave, notice, terminated]

    EmploymentType:
      type: string
      enum: [full_time, part_time, contract, intern]

    EmployeeUpdate:
      type: object
      description: Any subset of fields; sent fields may not be blank. `termination_date` is required when `status` is `terminated`.
      additionalProperties: false
      properties:
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        preferred_name:
          type: [string, 'null']
          maxLength: 100
        work_email:
          type: string
          format: email
          maxLength: 255
        job_title:
          type: string
          maxLength: 150
        employment_type:
          $ref: '#/components/schemas/EmploymentType'
        status:
          $ref: '#/components/schemas/EmployeeStatus'
        hire_date:
          type: string
          format: date
        termination_date:
          type: [string, 'null']
          format: date
        manager_id:
          type: [string, 'null']
          format: uuid
        personal_email:
          type: [string, 'null']
          format: email
        phone:
          type: [string, 'null']
          example: +94 77 123 4567
        date_of_birth:
          type: [string, 'null']
          format: date
          description: At least 16 years ago.

    EmployeeCreate:
      allOf:
        - $ref: '#/components/schemas/EmployeeUpdate'
        - type: object
          required: [first_name, last_name, work_email, job_title, employment_type, hire_date]

    CursorMeta:
      type: object
      required: [per_page, next_cursor, prev_cursor]
      properties:
        per_page:
          type: integer
        next_cursor:
          type: [string, 'null']
        prev_cursor:
          type: [string, 'null']

    CursorLinks:
      type: object
      properties:
        next:
          type: [string, 'null']
          format: uri
        prev:
          type: [string, 'null']
          format: uri

    AuditEvent:
      type: object
      required: [id, type, occurred_at, actor, action, subject, changes]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [audit_event]
        occurred_at:
          type: string
          format: date-time
        actor:
          type: object
          properties:
            type:
              type: string
              enum: [user, system]
            id:
              type: [string, 'null']
              format: uuid
        action:
          type: string
          example: employee.updated
        subject:
          type: object
          properties:
            type:
              type: string
              example: employee
            id:
              type: string
              format: uuid
        changes:
          type: object
          description: '{field: [old, new]}; personal data values are masked as "***".'
          additionalProperties:
            type: array
            minItems: 2
            maxItems: 2
          example:
            job_title: [Engineer, Lead Engineer]
        ip_address:
          type: [string, 'null']
        request_id:
          type: [string, 'null']
          format: uuid

    Problem:
      type: object
      description: RFC 9457 Problem Details.
      required: [type, title, status, code, detail, instance]
      properties:
        type:
          type: string
          format: uri
          example: https://docs.meridian.app/errors/invalid_credentials
        title:
          type: string
          example: Unauthorized
        status:
          type: integer
          example: 401
        code:
          type: string
          description: Stable, machine-readable error code.
          example: invalid_credentials
        detail:
          type: string
          example: The provided credentials are incorrect.
        instance:
          type: string
          example: /api/v1/auth/login
        request_id:
          type: [string, 'null']
          format: uuid

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: object
                  required: [code, message]
                  properties:
                    code:
                      type: string
                      example: required
                    message:
                      type: string
                      example: The email field is required.

  responses:
    Unauthenticated:
      description: Missing, invalid or expired access token (`unauthenticated`).
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidCredentials:
      description: Wrong e-mail/password, or the account is locked or disabled (`invalid_credentials`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Missing permission (`forbidden`) or unverified e-mail address (`email_not_verified`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist or is not visible to you (e.g. `employee_not_found`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Business conflict, e.g. `work_email_in_use`, `employee_has_direct_reports`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: The `If-Match` version is stale (`version_mismatch`) or malformed. Reload and retry.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: The `If-Match` header is missing (`precondition_required`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: The request body is invalid (`validation_failed`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    RateLimited:
      description: Too many requests (`rate_limited`).
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
