openapi: 3.1.0
info:
  title: Meridian API
  version: 1.0.0
  summary: Enterprise Employee Management Platform
  description: |
    REST API of the Meridian platform. This document is the contract between the
    API and its clients; it is validated in CI against every registered route.

    ## Authentication
    1. `POST /auth/login` returns a short-lived **JWT access token** (15 min) in the
       body and sets the **refresh token** in an `HttpOnly`, `Secure`,
       `SameSite=Strict` cookie scoped to `/api/v1/auth`.
    2. Send the access token as `Authorization: Bearer <token>`.
    3. Before it expires, call `POST /auth/refresh` (the browser sends the cookie).
       Refresh tokens are single-use and rotated; replaying a used one revokes the
       whole session.

    ## Errors
    Every error is an RFC 9457 `application/problem+json` document with a stable
    `code` and the `request_id` to quote to support.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8000/api/v1
    description: Local development
  - url: https://api.meridian.app/api/v1
    description: Production
tags:
  - name: Authentication
    description: Sign-in, token refresh and sign-out.
  - name: Password
    description: Forgotten-password flow.
  - name: Email verification
  - name: Current user
  - name: Access control
    description: Roles and permissions (RBAC).

paths:
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Sign in with e-mail and password
      description: |
        Rate limited per account and per IP. After 5 consecutive wrong passwords
        the account is locked for 15 minutes and the owner is e-mailed. Unknown
        accounts, wrong passwords, locked and disabled accounts all produce the
        same `invalid_credentials` error.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenEnvelope'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshToken
      summary: Rotate the refresh token and get a new access token
      security:
        - refreshTokenCookie: []
      responses:
        '200':
          description: New token pair. The previous refresh token is now invalid.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenEnvelope'
        '401':
          description: Missing, expired, revoked or reused refresh token (`invalid_refresh_token`). Sign in again.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: End the current session
      description: Revokes the presented access token and the session's refresh tokens, and clears the cookie.
      responses:
        '204':
          description: Signed out.
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/logout-all:
    post:
      tags: [Authentication]
      operationId: logoutEverywhere
      summary: End every session of the current user
      responses:
        '204':
          description: Every session on every device has been ended.
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/forgot-password:
    post:
      tags: [Password]
      operationId: forgotPassword
      summary: Request a password reset e-mail
      description: Always answers 202 so that the endpoint cannot be used to discover accounts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
      responses:
        '202':
          description: If the account exists and is active, a reset link has been sent.
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/reset-password:
    post:
      tags: [Password]
      operationId: resetPassword
      summary: Set a new password with a reset token
      description: Signs the user out on every device and marks the e-mail address as verified.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password changed.
        '422':
          description: Invalid input (`validation_failed`) or an invalid/expired token (`invalid_password_reset_token`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/email/verify/{id}/{hash}:
    get:
      tags: [Email verification]
      operationId: verifyEmail
      summary: Confirm an e-mail address (signed link from the e-mail)
      description: Opened in a browser. Redirects to the SPA's success or failure page.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: hash
          in: path
          required: true
          schema:
            type: string
        - name: expires
          in: query
          required: true
          schema:
            type: integer
        - name: signature
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to `{FRONTEND_URL}/email-verified` or `{FRONTEND_URL}/email-verification-failed`.

  /auth/email/verification-notification:
    post:
      tags: [Email verification]
      operationId: resendEmailVerification
      summary: Re-send the verification e-mail
      responses:
        '202':
          description: Sent, unless the address is already verified.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'

  /me:
    get:
      tags: [Current user]
      operationId: getCurrentUser
      summary: The signed-in user, roles and effective permissions
      description: Available to unverified users so the SPA can prompt for verification.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                  meta:
                    type: object
                    required: [roles, permissions]
                    properties:
                      roles:
                        type: array
                        items:
                          type: string
                        example: [tenant_admin]
                      permissions:
                        type: array
                        items:
                          type: string
                        example: [access.manage, audit.view]
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /permissions:
    get:
      tags: [Access control]
      operationId: listPermissions
      summary: The permission catalogue
      description: 'Requires `access.manage` and a verified e-mail address.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Permission'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /roles:
    get:
      tags: [Access control]
      operationId: listRoles
      summary: Roles and the permissions they grant
      description: 'Requires `access.manage` and a verified e-mail address.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256-signed JWT access token, valid for 15 minutes.
    refreshTokenCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Opaque, single-use refresh token set by login/refresh. Not readable by JavaScript.

  headers:
    RefreshTokenCookie:
      description: '`refresh_token=<opaque>; Path=/api/v1/auth; Secure; HttpOnly; SameSite=Strict`'
      schema:
        type: string

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: ada@meridian.test
        password:
          type: string
          format: password
          maxLength: 1024

    ResetPasswordRequest:
      type: object
      required: [token, email, password, password_confirmation]
      properties:
        token:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 1024
          description: At least 12 characters and not found in known data breaches.
        password_confirmation:
          type: string
          format: password

    AccessTokenEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AccessToken'

    AccessToken:
      type: object
      required: [access_token, token_type, expires_in, expires_at, user]
      properties:
        access_token:
          type: string
          example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiIsImtpZCI6InYxIn0...
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Seconds until the access token expires.
          example: 900
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, type, name, email, email_verified, status]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [user]
        name:
          type: string
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        status:
          type: string
          enum: [active, disabled]
        last_login_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time

    Permission:
      type: object
      required: [key, module, description, is_sensitive]
      properties:
        key:
          type: string
          example: employee.view
        module:
          type: string
          example: employee
        description:
          type: string
        is_sensitive:
          type: boolean

    Role:
      type: object
      required: [id, key, name, is_system, permissions]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          example: tenant_admin
        name:
          type: string
        description:
          type: [string, 'null']
        is_system:
          type: boolean
        permissions:
          type: array
          items:
            type: string

    Problem:
      type: object
      description: RFC 9457 Problem Details.
      required: [type, title, status, code, detail, instance]
      properties:
        type:
          type: string
          format: uri
          example: https://docs.meridian.app/errors/invalid_credentials
        title:
          type: string
          example: Unauthorized
        status:
          type: integer
          example: 401
        code:
          type: string
          description: Stable, machine-readable error code.
          example: invalid_credentials
        detail:
          type: string
          example: The provided credentials are incorrect.
        instance:
          type: string
          example: /api/v1/auth/login
        request_id:
          type: [string, 'null']
          format: uuid

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: object
                  required: [code, message]
                  properties:
                    code:
                      type: string
                      example: required
                    message:
                      type: string
                      example: The email field is required.

  responses:
    Unauthenticated:
      description: Missing, invalid or expired access token (`unauthenticated`).
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidCredentials:
      description: Wrong e-mail/password, or the account is locked or disabled (`invalid_credentials`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Missing permission (`forbidden`) or unverified e-mail address (`email_not_verified`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: The request body is invalid (`validation_failed`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    RateLimited:
      description: Too many requests (`rate_limited`).
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
