name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        php: ['8.3', '8.4']
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: meridian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meridian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, intl, sodium, mbstring
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Security audit
        run: composer audit

      - name: Code style
        run: vendor/bin/pint --test

      - name: Tests
        env:
          DB_HOST: 127.0.0.1
        run: vendor/bin/pest --parallel --coverage

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: API client is in sync with the OpenAPI contract
        run: |
          npm run api:generate
          git diff --exit-code -- src/services/api/generated

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    needs: [api, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: meridian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meridian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_DATABASE: meridian
      DB_USERNAME: meridian
      DB_PASSWORD: secret
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      FRONTEND_URL: http://localhost:5173
      REFRESH_TOKEN_COOKIE_SECURE: 'false'
      PASSWORD_CHECK_COMPROMISED: 'false'
      AUTH_RATE_LIMIT_LOGIN_PER_ACCOUNT: '100'
      AUTH_RATE_LIMIT_LOGIN_PER_IP: '200'
      E2E_EMAIL: e2e@meridian.test

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, intl, sodium, mbstring
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Generate throwaway secrets
        run: |
          for name in APP_KEY JWT_SECRET; do
            value="base64:$(openssl rand -base64 64 | tr -d '\n')"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "E2E_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Prepare the API
        working-directory: apps/api
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          touch .env
          php artisan migrate --force
          php artisan access:sync-permissions
          printf '%s' "$E2E_PASSWORD" | php artisan identity:create-user "$E2E_EMAIL" --name="E2E Admin" --role=hr_admin --role=auditor --password-stdin --verified

      - name: Build the web app
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build

      - name: Run Playwright
        working-directory: apps/web
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
